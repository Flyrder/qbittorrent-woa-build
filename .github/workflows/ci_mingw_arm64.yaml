name: Build qBittorrent Windows ARM64

on:
  push:
    branches: [ master, main, 'v5*' ]
    tags: [ 'v*' ]
  pull_request:
    paths:
      - '.github/workflows/ci_mingw_arm64.yaml'
      - 'cmake/Toolchain-llvm-mingw.cmake'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mingw-arm64:
    name: Build Windows ARM64 (llvm-mingw)
    runs-on: ubuntu-22.04
    env:
      llvm_path: "${{ github.workspace }}/llvm-mingw"
      library_path: "${{ github.workspace }}/library-mingw-arm64"
      libtorrent_path: "${{ github.workspace }}/library-mingw-arm64"
      qt_path: "${{ github.workspace }}/library-mingw-arm64"
      boost_path: "${{ github.workspace }}/boost"
      llvm_mingw_version: "20260616"
      libt_version: "2.0.15"
      qbt_version: "5.3.0"
      qt_version: "6.12.0"
      zlib_version: "1.3.2"
      boost_version: "1.92.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aria2 p7zip p7zip-full build-essential cmake ninja-build \
            pkg-config autoconf automake autoconf-archive make \
            texlive-binaries texinfo bison flex m4 libtool

      - name: Download and install llvm-mingw toolchain
        run: |
          aria2c "https://github.com/mstorsjo/llvm-mingw/releases/download/${{ env.llvm_mingw_version }}/llvm-mingw-${{ env.llvm_mingw_version }}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          tar -xf llvm-mingw-*.tar.xz
          mv llvm-mingw-${{ env.llvm_mingw_version }}-ucrt-ubuntu-22.04-x86_64 llvm-mingw
          echo "${{ env.llvm_path }}/bin" >> $GITHUB_PATH

      - name: Download Boost headers
        run: |
          boost_slug="${{ env.boost_version }}"
          boost_file_slug="${boost_slug//./_}"
          aria2c "https://archives.boost.io/release/${{ env.boost_version }}/source/boost_${boost_file_slug}.7z" -o "boost.7z"
          7z x "boost.7z" -o"${{ github.workspace }}"
          rm "boost.7z"
          mv "${{ github.workspace }}/boost_${boost_file_slug}" "${{ env.boost_path }}"

      - name: Install host Qt 6 tools
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '==3.1.*'
          version: '${{ env.qt_version }}'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'

      - name: Setup vcpkg and install OpenSSL
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'

      - name: Build static OpenSSL with vcpkg
        run: |
          export PATH="${{ env.llvm_path }}/bin:$PATH"
          cd ${{ env.RUNVCPKG_VCPKG_ROOT }}
          echo "set(VCPKG_BUILD_TYPE release)" >> triplets/community/arm64-mingw-static.cmake
          ./vcpkg upgrade
          ./vcpkg install openssl --triplet arm64-mingw-static --clean-after-build

      - name: Build static zlib for ARM64
        run: |
          TARGET=aarch64-w64-mingw32
          export PATH="${{ env.llvm_path }}/bin:$PATH"
          git clone https://github.com/madler/zlib.git --depth 1 --branch v${{ env.zlib_version }}
          cd zlib
          CC=$TARGET-gcc AR=$TARGET-ar RANLIB=$TARGET-ranlib ./configure --prefix="${{ env.library_path }}/zlib" --static
          make -j$(nproc)
          make install

      - name: Build static Qt 6 for Windows ARM64
        run: |
          export PATH="${{ env.llvm_path }}/bin:$PATH"
          git clone https://github.com/qt/qt5.git qt6
          cd qt6
          git checkout "v${{ env.qt_version }}"
          perl init-repository --module-subset=qtbase,qtsvg
          ./configure -opensource -confirm-license -nomake tests -nomake examples \
            -static -static-runtime -release -xplatform win32-clang-g++ \
            -prefix "${{ env.qt_path }}" -qt-host-path "${{ env.QT_ROOT_DIR }}" \
            -system-zlib -qt-sqlite -sql-sqlite -no-sql-mysql -no-sql-odbc -no-sql-psql -no-icu -c++std c++20 -- \
            -DQT_FEATURE_openssl_linked=ON \
            -DLLVM_ARCH=aarch64 \
            -DVCPKG_LIB_PREFIX="${{ env.RUNVCPKG_VCPKG_ROOT }}/installed/arm64-mingw-static" \
            -DLLVM_PREFIX="${{ env.llvm_path }}" \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/cmake/Toolchain-llvm-mingw.cmake" \
            -DLIBS_ROOT="${{ env.library_path }}"
          cmake --build . --parallel $(nproc)
          cmake --install .

      - name: Build static libtorrent for Windows ARM64
        run: |
          export PATH="${{ env.llvm_path }}/bin:$PATH"
          git clone \
            --branch v${{ env.libt_version }} \
            --depth 1 \
            --recurse-submodules \
            https://github.com/arvidn/libtorrent.git
          cd libtorrent
          cmake \
            -B build \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ env.libtorrent_path }}" \
            -DBOOST_ROOT="${{ env.boost_path }}" -DBOOST_SRC="${{ env.boost_path }}" \
            -DBUILD_SHARED_LIBS=OFF \
            -Ddeprecated-functions=OFF \
            -Dstatic_runtime=ON \
            -DLIBS_ROOT="${{ env.library_path }}" \
            -DLLVM_ARCH=aarch64 \
            -DVCPKG_LIB_PREFIX="${{ env.RUNVCPKG_VCPKG_ROOT }}/installed/arm64-mingw-static" \
            -DLLVM_PREFIX="${{ env.llvm_path }}" \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/cmake/Toolchain-llvm-mingw.cmake"
          cmake --build build --parallel $(nproc)
          cmake --install build

      - name: Build qBittorrent for Windows ARM64
        run: |
          export PATH="${{ env.qt_path }}/bin:${{ env.llvm_path }}/bin:$PATH"

          if [ -f "${{ github.workspace }}/src/app/main.cpp" ]; then
            echo "Building from workspace checkout..."
            qbt_src_dir="${{ github.workspace }}"
          else
            echo "Downloading qBittorrent source..."
            aria2c "https://sourceforge.net/projects/qbittorrent/files/qbittorrent/qbittorrent-${{ env.qbt_version }}/qbittorrent-${{ env.qbt_version }}.tar.xz"
            tar -xf "qbittorrent-${{ env.qbt_version }}.tar.xz"
            qbt_src_dir="${{ github.workspace }}/qbittorrent-${{ env.qbt_version }}"
          fi

          mkdir -p "${{ github.workspace }}/build-qbt"
          cd "${{ github.workspace }}/build-qbt"

          cmake \
            -S "${qbt_src_dir}" \
            -B . \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.qt_path }};${{ env.libtorrent_path }};${{ env.library_path }}" \
            -DBOOST_ROOT="${{ env.boost_path }}" \
            -DBOOST_SRC="${{ env.boost_path }}" \
            -DLibtorrentRasterbar_DIR="${{ env.libtorrent_path }}/lib/cmake/LibtorrentRasterbar" \
            -DSTACKTRACE=OFF \
            -DQT6=ON \
            -DLIBS_ROOT="${{ env.library_path }}" \
            -DLLVM_ARCH=aarch64 \
            -DVCPKG_LIB_PREFIX="${{ env.RUNVCPKG_VCPKG_ROOT }}/installed/arm64-mingw-static" \
            -DLLVM_PREFIX="${{ env.llvm_path }}" \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/cmake/Toolchain-llvm-mingw.cmake"

          cmake --build . --parallel $(nproc)

      - name: Package build artifacts
        run: |
          mkdir -p upload
          cp build-qbt/qbittorrent.exe upload/
          if [ -f dist/windows/qt.conf ]; then
            cp dist/windows/qt.conf upload/
          fi
          cd upload
          7z a "../qbittorrent_${{ env.qbt_version }}_arm64.zip" *
          cd ..

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qBittorrent_${{ env.qbt_version }}_arm64
          path: upload/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: qbittorrent_${{ env.qbt_version }}_arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
